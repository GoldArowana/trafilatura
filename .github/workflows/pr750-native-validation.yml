name: PR750 exact-source validation
on:
  push:
    branches: ["codex-validation/pr750-native-0bec4"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_SOURCE_REPOSITORY: GoldArowana/trafilatura
      EXPECTED_UPSTREAM_REPOSITORY: adbar/trafilatura
      EXPECTED_SOURCE_SHA: b42f392e979e792cb782f224a9de55f919093665
      EXPECTED_SOURCE_TREE: 17f5c4c4b97e210eb054405c05007dbb3668e6d8
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_NO_CACHE_DIR: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          repository: GoldArowana/trafilatura
          ref: b42f392e979e792cb782f224a9de55f919093665
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Assert tested source identity before setup
        run: |
          test "$GITHUB_REPOSITORY" = "$EXPECTED_SOURCE_REPOSITORY"
          case "$(git config --get remote.origin.url)" in
            "https://github.com/$EXPECTED_SOURCE_REPOSITORY"|"https://github.com/$EXPECTED_SOURCE_REPOSITORY.git") ;;
            *) exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_SOURCE_TREE"
          git diff HEAD --exit-code
      - name: Documented development bootstrap
        run: python -m pip install --no-cache-dir -e ".[dev]"
      - name: Assert bootstrap preserved tracked source
        run: git diff HEAD --exit-code
      - name: Regression and related extraction tests
        run: python -m pytest tests/paragraph_threshold_tests.py tests/unit_tests.py tests/realworld_tests.py -q -p no:cacheprovider
      - name: Static checks
        run: |
          python -m mypy --cache-dir=/dev/null -p trafilatura
          python -m ruff check .
          python -m ruff format --check .
      - name: Pinned extraction quality gate
        run: python tests/eval_gate.py
      - name: Always verify exact source and unchanged tracked files
        if: always()
        run: |
          test "$GITHUB_REPOSITORY" = "$EXPECTED_SOURCE_REPOSITORY"
          case "$(git config --get remote.origin.url)" in
            "https://github.com/$EXPECTED_SOURCE_REPOSITORY"|"https://github.com/$EXPECTED_SOURCE_REPOSITORY.git") ;;
            *) exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_SOURCE_TREE"
          git diff HEAD --exit-code
